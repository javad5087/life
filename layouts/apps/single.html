<div id="b" class="col-md-7 mx-auto text-justify lead text-dark">

    <h3 class="fw-600">{{ .Title }}</h3>
    <br>

    {{ $page := . }}

    {{ with .Params.gallery }}

    <div class="gallery gallery-4-type4" data-provide="photoswipe">

        {{ with index . 0 }}
        <a class="gallery-item"
           href="{{ . }}"
           data-provide="lightbox"
           data-gallery="property-{{ $page.File.UniqueID }}">
            <img src="{{ . }}" alt="">
        </a>
        {{ end }}

        <div class="gallery-item-group">
            {{ range first 3 (after 1 .) }}
            <a class="gallery-item"
               href="{{ . }}"
               data-provide="lightbox"
               data-gallery="property-{{ $page.File.UniqueID }}">
                <img src="{{ . }}" alt="">
            </a>
            {{ end }}
        </div>

    </div>

    {{ end }}

    <h6>چکیده</h6>

    {{ .Content }}

</div>
